<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Shoe Finder - Ready Jet Roam</title>
<meta name="description" content="Tell me about your trip and I'll fill your three shoe slots. Never pack more than three pairs.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Dancing+Script:wght@600;700&family=Caveat:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">

<style>
/* =========================================================================
   BRAND TOKENS
   Colors and fonts matched to the live Packing Assistant page.
   [MATT: change a value here and it updates everywhere in the tool.]
   ========================================================================= */
:root{
  /* Matched to the Packing Assistant: deep petrol blue does the headings
     and structure, orange does the accents and anything you click. */
  --paper:       #faf7f0;   /* warm cream page background */
  --card:        #fffdf9;
  --ink:         #2f6b7a;   /* headings, the deep petrol blue */
  --ink-dark:    #24525e;   /* darker press of the same blue */
  --body:        #4f6b76;   /* body copy, softer than headings */
  --ink-soft:    #6c848e;   /* secondary text */
  --teal-tint:   #e6eef1;   /* pale blue fills */
  --orange:      #e0762a;   /* accents, script words, buttons */
  --orange-dark: #c4611c;   /* hover / pressed */
  --orange-soft: #fdf0e4;   /* pale orange fills */
  --line:        #ece5d8;   /* borders */
  --shadow:      0 18px 40px -28px rgba(47,107,122,.42);
  --font-head:   'Fraunces', Georgia, serif;
  --font-body:   'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
  --font-script: 'Dancing Script', 'Caveat', cursive;
}

*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  font-family:var(--font-body);
  background:var(--paper);
  color:var(--body);
  font-size:18px;
  line-height:1.6;
  padding:0 16px 48px;
}
.wrap{max-width:700px;margin:0 auto}
.skip-link{position:absolute;left:-9999px}
.skip-link:focus{position:static;display:inline-block;padding:10px;background:var(--ink);color:#fff}

/* ---------- Brand + hero ---------- */
.brand{text-align:center;padding:22px 0 4px}
.brand-link{display:inline-block;text-decoration:none}
.brand-wordmark{
  font-family:var(--font-head);font-weight:700;font-size:1.15rem;
  letter-spacing:.02em;color:var(--ink);
}
.brand-wordmark span{color:var(--orange)}

.hero{display:flex;align-items:center;gap:20px;padding:14px 0 6px}
.hero-text{flex:1;min-width:0}
.hero h1{
  font-family:var(--font-head);font-weight:700;
  font-size:clamp(2.1rem,7.2vw,3.1rem);
  line-height:1.04;letter-spacing:-.02em;color:var(--ink);
}
/* The script word sits inline in the headline, the way "Assistant" does. */
.hero h1 .pop{
  font-family:var(--font-script);font-weight:700;font-style:normal;
  font-size:1.18em;color:var(--orange);letter-spacing:0;
  padding-right:.06em;
}
.hero .tag{margin-top:14px;color:var(--body);font-size:1.05rem;line-height:1.55}

.polaroid{
  flex:0 0 150px;position:relative;background:#fff;padding:11px 11px 30px;
  border-radius:2px;box-shadow:0 16px 34px -20px rgba(47,107,122,.5);
  transform:rotate(2deg);
}
.polaroid .tape{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%) rotate(-2deg);
  width:62px;height:22px;background:rgba(160,190,203,.42);
  border-left:1px dashed rgba(255,255,255,.6);border-right:1px dashed rgba(255,255,255,.6);
}
.polaroid .photo{
  width:128px;height:128px;background:var(--teal-tint);border-radius:1px;
  display:flex;align-items:center;justify-content:center;font-size:2.6rem;overflow:hidden;
}
.polaroid .photo img{width:100%;height:100%;object-fit:cover;display:block}
.brand-logo{display:block;width:200px;max-width:70vw;height:auto;margin:0 auto}

.band{
  height:5px;border-radius:99px;margin:22px 0 8px;
  background:linear-gradient(90deg,var(--ink) 0%,var(--ink) 46%,var(--orange) 46%,var(--orange) 66%,var(--line) 66%);
}

/* ---------- Panels ---------- */
.panel{
  background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:26px 24px;margin-top:20px;box-shadow:var(--shadow);
}
.kicker{
  display:inline-block;font-size:.78rem;font-weight:800;letter-spacing:.16em;
  text-transform:uppercase;color:#fff;
  background:var(--ink);padding:9px 18px;border-radius:10px;margin-bottom:16px;
}
h2.step{
  font-family:var(--font-head);font-weight:700;
  font-size:clamp(1.55rem,4.6vw,2rem);line-height:1.08;
  letter-spacing:-.015em;color:var(--ink);margin-bottom:8px;
}
h2.step .scr{
  display:block;font-family:var(--font-script);font-weight:700;
  font-size:1.24em;color:var(--orange);line-height:1.05;
  letter-spacing:0;margin-top:1px;
}
p.lead{color:var(--body);font-size:1.03rem;margin-bottom:6px}

/* ---------- The system explainer ---------- */
details.sys{
  border:1px solid var(--line);border-radius:16px;background:var(--paper);
  margin:18px 0 6px;overflow:hidden;
}
details.sys summary{
  list-style:none;cursor:pointer;padding:16px 18px;display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
details.sys summary::-webkit-details-marker{display:none}
.sys-label{
  font-family:var(--font-head);font-weight:700;font-size:1.2rem;
  line-height:1.2;color:var(--orange);flex:1 1 260px;
}
.sys-cta{
  display:inline-block;background:var(--orange);color:#fff;
  font-size:.86rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  padding:14px 24px;border-radius:99px;white-space:nowrap;
  box-shadow:0 10px 22px -14px rgba(196,97,28,.9);
}
details.sys summary:hover .sys-cta{background:var(--orange-dark)}
.sys-cta .chev{display:inline-block;margin-left:8px;transition:transform .2s}
details.sys[open] .sys-cta .chev{transform:rotate(90deg)}
details.sys .body{padding:0 18px 20px}
details.sys .body p{margin-bottom:12px;font-size:.98rem}
ul.sysrules{list-style:none;margin-top:6px}
ul.sysrules li{display:flex;gap:12px;margin-bottom:12px;font-size:.98rem}
ul.sysrules .num{
  flex:0 0 26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;
  font-weight:800;font-size:.85rem;display:flex;align-items:center;justify-content:center;
}
.payoff{
  background:var(--orange-soft);border-radius:12px;padding:14px 16px;
  font-size:.96rem;margin-top:14px;
}
.payoff b{display:block;font-family:var(--font-head);margin-bottom:2px}

/* ---------- Progress ---------- */
.progwrap{margin-bottom:18px}
.progbar{height:10px;background:var(--teal-tint);border-radius:99px;overflow:hidden}
.progfill{height:100%;background:var(--orange);border-radius:99px;transition:width .35s ease}
.progtxt{
  display:flex;justify-content:space-between;font-size:.85rem;
  color:var(--ink-soft);font-weight:700;margin-top:8px;
}

/* ---------- Fields and options ---------- */
.field{margin-top:18px}
.field label,.qlabel{
  display:block;font-weight:700;font-size:1.05rem;margin-bottom:4px;color:var(--ink);
}
.hint{font-weight:600;font-size:.86rem;color:var(--ink-soft)}
.opts{display:flex;flex-direction:column;gap:11px;margin-top:14px}
.opt{
  display:block;width:100%;text-align:left;cursor:pointer;font-family:var(--font-body);
  background:var(--paper);border:2px solid var(--line);border-radius:14px;
  padding:15px 17px;font-size:1.02rem;font-weight:700;color:var(--ink-dark);
  min-height:58px;transition:border-color .15s,background .15s,transform .08s;
}
.opt .sub{display:block;font-size:.88rem;font-weight:400;color:var(--ink-soft);margin-top:3px}
.opt:hover{border-color:var(--ink);background:var(--teal-tint)}
.opt:active{transform:translateY(1px)}
.opt:focus-visible{outline:3px solid var(--orange);outline-offset:2px}

.cta-row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.cta{
  cursor:pointer;border:none;border-radius:99px;font-family:var(--font-body);
  background:var(--orange);color:#fff;font-size:1.05rem;font-weight:800;
  padding:16px 32px;min-height:56px;transition:background .15s,transform .08s;
  box-shadow:0 12px 26px -16px rgba(196,97,28,.95);
}
.cta:hover{background:var(--orange-dark)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.cta.ghost{
  background:none;color:var(--ink);border:2px solid var(--line);font-weight:700;
  box-shadow:none;
}
.cta.ghost:hover{background:var(--teal-tint);border-color:var(--ink)}
.cta.sm{font-size:.92rem;padding:11px 18px;min-height:46px}
.toptools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}

/* ---------- Results ---------- */
.summary{
  background:var(--teal-tint);border-radius:14px;padding:14px 18px;
  font-size:.98rem;margin:6px 0 20px;
}
.slot{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:20px;margin-bottom:16px;box-shadow:var(--shadow);
}
.slot .slot-no{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.slot .num{
  flex:0 0 30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;
  font-weight:800;font-size:.95rem;display:flex;align-items:center;justify-content:center;
}
.slot h3{font-family:var(--font-head);font-weight:700;font-size:1.3rem;color:var(--ink)}
.slot .why-slot{color:var(--ink-soft);font-size:.97rem;margin-bottom:16px}
.pick{display:flex;gap:15px;align-items:flex-start}
.pick-img{
  flex:0 0 92px;width:92px;background:#fff;padding:7px 7px 7px;border-radius:3px;
  box-shadow:var(--shadow);transform:rotate(-2deg);
}
.pick-img .ph{
  width:100%;aspect-ratio:1;background:var(--teal-tint);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:1.9rem;
}
.pick-img img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;display:block}
.pick-img .ph-note{
  font-family:var(--font-script);font-size:.85rem;color:var(--ink-soft);
  text-align:center;line-height:1;margin-top:4px;
}
.pick-info{flex:1;min-width:0}
.pick-info .name{font-family:var(--font-head);font-weight:700;font-size:1.1rem;color:var(--ink)}
.pick-info .why{font-size:.97rem;margin:8px 0 14px}
.badge,.fits{
  display:inline-block;border-radius:99px;font-size:.76rem;font-weight:800;
  padding:5px 12px;margin-top:7px;line-height:1.35;
}
.badge{background:var(--orange);color:#fff}
.fits{background:var(--teal-tint);color:var(--ink-dark)}
.buy{
  display:inline-block;background:var(--orange);color:#fff;text-decoration:none;
  border-radius:99px;font-weight:800;font-size:.95rem;padding:13px 24px;min-height:48px;
  box-shadow:0 10px 22px -14px rgba(196,97,28,.9);
}
.buy:hover{background:var(--orange-dark)}
.checked{font-size:.78rem;color:var(--ink-soft);margin-top:10px}

.tip{
  background:var(--orange-soft);border-radius:16px;padding:20px 22px;margin:24px 0;
}
.tip .lbl{
  font-family:var(--font-script);font-weight:700;font-size:1.75rem;color:var(--orange);
  line-height:1.1;margin-bottom:10px;
}
.tip ul{list-style:none}
.tip li{display:flex;gap:11px;margin-bottom:11px;font-size:.98rem}
.tip li:last-child{margin-bottom:0}
.tip li .dot{flex:0 0 8px;height:8px;border-radius:50%;background:var(--orange);margin-top:9px}

.skip-box{
  border:2px dashed var(--line);border-radius:16px;padding:20px 22px;margin:24px 0;
}
.skip-box h4{font-family:var(--font-head);font-weight:700;font-size:1.15rem;margin-bottom:10px;color:var(--ink)}
.skip-box p{font-size:.97rem;color:var(--ink-soft)}

/* ---------- Footer ---------- */
footer{
  margin-top:34px;padding-top:22px;border-top:1px solid var(--line);
  font-size:.9rem;color:var(--ink-soft);text-align:center;
}
footer a{color:var(--orange-dark)}
.sig{font-family:var(--font-script);font-weight:700;font-size:2.1rem;color:var(--orange);line-height:1.1;margin-bottom:8px}
.foot-cta{
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:16px 18px;font-size:1rem;color:var(--ink);margin-bottom:18px;text-align:left;
}
.disc{font-size:.82rem;margin-top:14px;line-height:1.5}
footer p{margin-bottom:10px}

/* ---------- Print ---------- */
@media print{
  body{background:#fff;color:#000;font-size:12pt;padding:0}
  .no-print,.buy,.cta-row,.toptools,.progwrap,.polaroid,.band,.kicker,.foot-cta{display:none !important}
  .panel,.slot{box-shadow:none;border:1px solid #999;break-inside:avoid}
  .tip,.summary{background:#fff;border:1px solid #999}
  a{color:#000;text-decoration:none}
}

@media (max-width:520px){
  body{font-size:17px}
  .hero{gap:14px}
  .hero h1{font-size:1.85rem}
  .polaroid{flex-basis:112px;padding:8px 8px 22px}
  .polaroid .photo{width:96px;height:96px;font-size:2rem}
  .panel{padding:22px 18px}
  h2.step{font-size:1.5rem}
  h2.step .scr{font-size:1.65rem}
  .pick-img{flex-basis:78px;width:78px}
}
</style>

/* =========================================================================
   RECOMMENDATION LOGIC
   ========================================================================= */
function buildContext(a){
  // Would I call this destination genuinely wet if she isn't sure?
  const autoWet =
    (a.region === 'uk-scandi' && a.season !== 'summer') ||
    (a.season === 'winter' && a.region !== 'warm');

  const wetClimate =
    a.rain === 'probably' ||
    a.scenario === 'rainy-shoulder' ||
    a.scenario === 'winter-city' ||
    (a.rain === 'no-idea' && autoWet);

  return {
    region: a.region, season: a.season, length: a.length, scenario: a.scenario,
    hiking: a.hiking === 'yes',
    sport: a.sport,
    dressy: a.dressy === 'yes',
    wetClimate: wetClimate,
    cold: a.season === 'winter' || a.scenario === 'winter-city'
  };
}

function scoreShoe(shoe, job, ctx){
  let score = 0;
  if (shoe.scenarios.includes(ctx.scenario)) score += 4;
  if (shoe.lisaVerified) score += 2;
  if (ctx.wetClimate && shoe.waterproof) score += 1;
  if (ctx.dressy && job === 'nice' && shoe.tags.includes('dressy')) score += 1;
  return score;
}

function pickShoe(job, ctx, usedIds){
  let pool = SHOES.filter(function(s){
    if (!s.jobs.includes(job)) return false;
    if (usedIds.indexOf(s.id) !== -1) return false;
    if (s.gender !== "women's" && s.gender !== 'unisex') return false;
    return true;
  });

  // The hard rules of the three-pair system:
  if (job === 'miles'){
    if (ctx.sport !== 'none'){
      // The sport shoe BECOMES the miles pair. It doesn't get added.
      const sportPool = pool.filter(function(s){ return s.sports.includes(ctx.sport); });
      if (sportPool.length) pool = sportPool;
    } else if (ctx.wetClimate){
      // Genuinely wet trip: the miles pair must be waterproof, not water resistant.
      const wpPool = pool.filter(function(s){ return s.waterproof; });
      if (wpPool.length) pool = wpPool;
    }
  }
  if (job === 'wet'){
    if (ctx.hiking){
      // Real hiking: trail shoes take the wet slot. Sandals stay home.
      const trailPool = pool.filter(function(s){ return s.tags.includes('trail'); });
      if (trailPool.length) pool = trailPool;
    } else if (ctx.scenario === 'winter-city' || (ctx.cold && ctx.region !== 'warm')){
      // Winter: the trip's version of water is slush. Warm waterproof boot.
      const winterPool = pool.filter(function(s){ return s.tags.includes('winter'); });
      if (winterPool.length) pool = winterPool;
    }
  }

  pool.sort(function(a, b){
    const diff = scoreShoe(b, job, ctx) - scoreShoe(a, job, ctx);
    if (diff !== 0) return diff;
    return SHOES.indexOf(a) - SHOES.indexOf(b); // stable: earlier entry wins ties
  });
  return pool[0] || null;
}

function slotCopy(job, ctx){
  if (job === 'miles'){
    if (ctx.sport !== 'none'){
      const doing = ctx.sport === 'gym' ? 'work out' : (ctx.sport === 'court' ? 'play' : 'run');
      let copy = "You said you'll " + doing + " on this trip, so your sport shoe does double duty: it IS your miles pair. It doesn't get its own slot, it earns this one.";
      if (ctx.wetClimate) copy += " Fair warning: it isn't waterproof, so pack spare merino socks and let it dry overnight.";
      return copy;
    }
    if (ctx.wetClimate){
      return "You're headed somewhere genuinely wet, so water resistant won't cut it. This pair needs to be waterproof, full stop. Wet feet are annoying. Wet feet in a shoe you're also breaking in is a bad day.";
    }
    return "This is the pair you'll live in. Cobblestones, museum floors, the long way back to the hotel. If you'd walk 20,000 steps in it without regret, it belongs here.";
  }
  if (job === 'nice'){
    if (ctx.scenario === 'winter-city'){
      return "Dinner still happens in winter, and it usually involves a wet sidewalk on the way. This pair gets you there feeling like yourself, with dry feet.";
    }
    if (ctx.dressy){
      return "You've got at least one dinner where you'll want to feel like yourself, not like someone who packed sneakers. This pair is for that night.";
    }
    return "Even a casual trip has one evening that turns into something. One pair that isn't a sneaker saves that evening, and it barely takes any space.";
  }
  // wet
  if (ctx.hiking){
    return "You're doing real hiking, so trail shoes take this slot and the sandals stay home. Trails beat beaches for this spot, every time.";
  }
  if (ctx.scenario === 'winter-city' || (ctx.cold && ctx.region !== 'warm')){
    return "Your trip's version of water is slush, snowbanks and cold puddles. This slot goes to a boot that keeps all of that on the outside.";
  }
  if (ctx.scenario === 'beach-town' || ctx.scenario === 'cruise' || ctx.region === 'warm'){
    return "Beach, pool deck, hotel shower. This pair handles every wet surface on the trip and takes up about as much room as a paperback.";
  }
  return "Every trip has water somewhere: a hotel shower you don't trust, a pool, a surprise warm afternoon. This pair weighs nothing and covers all of it.";
}

const TIPS = {
  plane:   "Wear your bulkiest pair on the plane. Suitcase space is for the light stuff.",
  breakin: "Break new shoes in for a few weeks before you go, never the week you fly. Wet feet are annoying. Wet feet in a shoe you're also breaking in is a bad day.",
  merino:  "Pack merino socks. Merino insulates even when it's damp. Cotton doesn't."
};

function pickTips(ctx){
  const tips = [TIPS.plane];
  if (ctx.wetClimate || ctx.cold || ctx.hiking) tips.push(TIPS.merino);
  if (ctx.hiking || ctx.scenario === 'long-walking' || ctx.length === 'long') tips.push(TIPS.breakin);
  if (tips.length < 2) tips.push(TIPS.breakin);
  return tips.slice(0, 3);
}

function recommend(answers){
  const ctx = buildContext(answers);
  const used = [];
  const slots = ['miles', 'nice', 'wet'].map(function(job){
    const shoe = pickShoe(job, ctx, used);
    if (shoe) used.push(shoe.id);
    return { job: job, shoe: shoe, why: slotCopy(job, ctx) };
  });
  return { ctx: ctx, slots: slots, tips: pickTips(ctx) };
}

/* Builds a working buy link. Real URLs pass through untouched; placeholders
   fall back to a tagged Amazon search so no button is ever dead. */
function buyUrl(shoe){
  const url = (shoe.amazonUrl || '').trim();
  if (url.indexOf('http') === 0) return url;
  if (url.indexOf('ROTHYS') !== -1) return 'https://rothys.com/';
  const q = encodeURIComponent(shoe.brand + ' ' + shoe.name + ' women');
  return 'https://www.amazon.com/s?k=' + q + '&tag=' + AMAZON_TAG;
}
function buyLabel(shoe){
  if ((shoe.amazonUrl || '').indexOf('ROTHYS') !== -1) return "See it at Rothy's";
  return 'See it on Amazon';
}

    document.getElementById('print-btn').addEventListener('click', function(){ window.print(); });
    document.getElementById('retake-btn').addEventListener('click', function(){
      step = QUESTIONS.length - 1;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    document.getElementById('reset-btn').addEventListener('click', function(){
      for (const k in answers) delete answers[k];
      step = -1;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
    renderFooter(true);
  }

  function render(){
    if (step < 0) renderIntro();
    else if (step < QUESTIONS.length) renderQuestion();
    else renderResults();
  }

  setupImages();
  render();
})(); }
</script>
</body>
</html>
